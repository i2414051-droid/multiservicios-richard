{% extends 'base.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="height:80vh;">

    <div class="card shadow p-4" style="width:350px;">

        <h3 class="text-center mb-3"> Iniciar Sesion </h3>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <!-- CAMPO CORREO -->
            <input type="email"
                   name="correo"
                   placeholder="Correo electrónico"
                   class="form-control mb-3"
                   required>

            <!-- CAMPO PASSWORD CON OJO -->
            <div class="mb-3 position-relative">
                <input type="password"
                       name="password"
                       id="password"
                       placeholder="Contraseña"
                       class="form-control"
                       required>
                <button type="button"
                        class="position-absolute top-0 end-0 m-2 btn-link text-secondary py-0"
                        onclick="togglePassword()"
                        style="border:none; background:none; cursor:pointer;">
                    <i id="eye-icon" class="bi bi-eye"></i>
                </button>
            </div>

            <!-- MENSAJES FLASH -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}

                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} p-2 text-center">
                            {{ message }}
                        </div>
                    {% endfor %}

                {% endif %}
            {% endwith %}

            <button class="btn btn-primary w-100">
                Ingresar
            </button>

        </form>

        <!-- LINK REGISTRO -->
        <div class="text-center mt-3">
            <a href="/registro">Crear cuenta</a>
        </div>
        <div class="text-center mt-2">
            <a href="/recuperar-password" style="color:#f39c12;font-size:13px">¿Olvidaste tu contraseña?</a>
        </div>

    </div>

</div>

<script>
function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>

{% endblock %}
