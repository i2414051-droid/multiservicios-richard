{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width:450px">
  <div class="card" style="background:#08111f;border:1px solid rgba(243,156,18,.25);border-radius:18px">
    <div class="card-body p-4">
      <h3 class="text-center mb-3" style="color:#f39c12;font-weight:800">
        <i class="bi bi-shield-lock"></i> Nueva Contraseña
      </h3>
      <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" style="color:#aaa">Nueva contraseña</label>
          <input type="password" class="form-control bg-dark text-white border-0" name="nueva"
                 placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label" style="color:#aaa">Confirmar contraseña</label>
          <input type="password" class="form-control bg-dark text-white border-0" name="confirmar_password"
                 placeholder="Repite la contraseña" required>
        </div>
        <button type="submit" class="btn btn-warning fw-bold w-100" style="border-radius:15px">
          <i class="bi bi-check-lg me-1"></i> Restablecer contraseña
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
