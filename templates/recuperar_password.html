{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width:450px">
  <div class="card" class="tc">
    <div class="card-body p-4">
      <h3 class="text-center mb-3" style="color:#f39c12;font-weight:800">
        <i class="bi bi-key"></i> Recuperar Contraseña
      </h3>
      <p class="text-center" style="color:#aaa">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
      <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <input type="email" class="form-control bg-dark text-white border-0" name="correo"
                 placeholder="Correo electrónico" required>
        </div>
        <button type="submit" class="btn btn-warning fw-bold w-100" style="border-radius:15px">
          <i class="bi bi-send me-1"></i> Enviar enlace
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="/login" style="color:#f39c12">Volver al login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
