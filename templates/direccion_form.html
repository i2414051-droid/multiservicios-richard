{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width:600px">
  <h2 style="color:#f39c12;font-weight:800">
    <i class="bi bi-geo-alt"></i> {{ 'Editar' if editar else 'Nueva' }} Dirección
  </h2>

  <div class="card mt-4" class="tc">
    <div class="card-body p-4">
      <form method="POST" action="{{ '/direcciones/editar/' ~ editar.id if editar else '/direcciones/nueva' }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label class="form-label" style="color:#f39c12;font-weight:600">Dirección *</label>
          <input type="text" class="form-control bg-dark text-white border-0" name="direccion"
                 value="{{ editar.direccion if editar else '' }}" required placeholder="Av. Ejemplo 123">
        </div>

        <div class="mb-3">
          <label class="form-label" style="color:#f39c12;font-weight:600">Distrito</label>
          <input type="text" class="form-control bg-dark text-white border-0" name="distrito"
                 value="{{ editar.distrito if editar else '' }}" placeholder="Ej: San Martín de Porres">
        </div>

        <div class="mb-3">
          <label class="form-label" style="color:#f39c12;font-weight:600">Referencia</label>
          <input type="text" class="form-control bg-dark text-white border-0" name="referencia"
                 value="{{ editar.referencia if editar else '' }}" placeholder="Ej: Frente al parque">
        </div>

        <div class="mb-4">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="predeterminada" value="1"
                   {% if editar and editar.predeterminada %}checked{% endif %}>
            <label class="form-check-label" style="color:#ccc">Establecer como dirección predeterminada</label>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning fw-bold">
            <i class="bi bi-check-lg me-1"></i> {{ 'Actualizar' if editar else 'Guardar' }}
          </button>
          <a href="/direcciones" class="btn btn-outline-light">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
