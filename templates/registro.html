<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="height:100vh;">

    <div class="card shadow p-4" style="width:400px;">

        <h3 class="text-center mb-3">📝 Crear cuenta</h3>

        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <input type="hidden" name="documento_tipo" value="dni">

            <!-- NOMBRES -->
            <div class="mb-3">
                <label class="form-label">Nombres</label>
                <input type="text" name="nombres" placeholder="Nombres" class="form-control" required>
            </div>

            <!-- APELLIDOS -->
            <div class="mb-3">
                <label class="form-label">Apellidos</label>
                <input type="text" name="apellidos" placeholder="Apellidos" class="form-control" required>
            </div>

            <!-- CORREO -->
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="correo" placeholder="Correo electrónico" class="form-control" required>
            </div>

            <!-- CONTRASEÑA CON OJO -->
            <div class="mb-3 position-relative">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Contraseña" class="form-control" required>
                <button type="button" class="position-absolute top-0 end-0 m-2 btn-link text-secondary py-0"
                        onclick="togglePassword()" style="border:none; background:none; cursor:pointer;">
                    <i id="eye-icon" class="bi bi-eye"></i>
                </button>
            </div>

            <!-- CONFIRMAR CONTRASEÑA CON OJO -->
            <div class="mb-3 position-relative">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" name="confirmar" id="confirmar" placeholder="Confirmar contraseña" class="form-control" required>
                <button type="button" class="position-absolute top-0 end-0 m-2 btn-link text-secondary py-0"
                        onclick="toggleConfirmPassword()" style="border:none; background:none; cursor:pointer;">
                    <i id="eye-icon-confirm" class="bi bi-eye"></i>
                </button>
            </div>

            <button class="btn btn-success w-100">
                Registrarse
            </button>

        </form>

        <div class="text-center mt-3">
            <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
        </div>

    </div>

</div>

<script>
function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}

function toggleConfirmPassword() {
    const input = document.getElementById('confirmar');
    const icon = document.getElementById('eye-icon-confirm');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
</script>

</body>
</html>
