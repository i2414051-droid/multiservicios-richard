<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoja de reclamación {{ r.codigo }} — {{ empresa_info.nombre }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reclamaciones.css') }}">
</head>
<body class="lr-print-body">

  <div class="lr-print-toolbar lr-no-print">
    <div class="lr-print-titulo">
      <i class="bi bi-file-earmark-text me-1"></i>
      Hoja de reclamación <strong>{{ r.codigo }}</strong> ·
      Vista previa de impresión (A4)
    </div>
    <div class="d-flex gap-2">
      <a href="{{ url_for('detalle_reclamacion', id=r.id) }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Volver
      </a>
      <button type="button" class="btn btn-warning btn-sm fw-bold" onclick="window.print()">
        <i class="bi bi-printer me-1"></i> Imprimir / Guardar PDF
      </button>
    </div>
  </div>

  {% with copia = 'empresa' %}
    {% include '_hoja_reclamacion.html' %}
  {% endwith %}

  <div class="lr-print-toolbar lr-no-print" style="margin-top:18px;justify-content:center">
    <small style="color:#6b7280;font-family:Arial,Helvetica,sans-serif">
      Si el botón no abre el diálogo, presiona <strong>Ctrl + P</strong> y elige
      “Guardar como PDF” para archivar la hoja.
    </small>
  </div>

</body>
</html>
